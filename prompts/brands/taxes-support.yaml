name: "Taxes Support"
summary: "Romanian crypto tax brand (formerly The Crypto Support): plain-language explanations of how crypto is taxed in Romania and the EU."
audience: "Retail crypto holders in Romania who want to declare correctly without a tax background."
language:
  default: ro
voice: |
  Calm, direct and reassuring. Explain, do not scare.
  Informal "tu". Plain words; define every tax term once.
  Facts with dates and sources; never hype, price predictions or investment advice.
  At least 40% of topics are Romanian or EU rules.
content_types: [tax-consequence, contrast-news, deadline-watch, myth-vs-fact]
cta:
  # handle de confirmat: the new handle is not known yet, so the brand name is used.
  default: "Afli mai multe de la Taxes Support."
hashtags:
  default: []
bullet: "-"
emoji: none
avoid: []
disclaimer: ""
# Search themes for the news research step (a private brand.yaml adds to this list).
news_topics:
  - "crypto taxation in Romania: rates, thresholds and filing deadlines"
  - "DAC8 crypto reporting in the EU and what reaches the Romanian tax authority"
  - "ANAF guidance, decisions and enforcement on crypto income"
  - "MiCA for retail users: which platforms are licensed and what changes in the apps they use"
  - "stablecoin delistings and migrations affecting EU retail users"
  - "tax treatment of staking, airdrops and DeFi income in the EU"
  - "exchange and broker tax reports for customers in Romania"
  - "large institutions entering crypto, with the consequence for a Romanian holder"
