# Verified facts for the generator. Each fact has a fiscal year or validity range.
# Only the generator uses these. A human maintains this file.
#
# The generator ignores a fact whose valid_to is before today or whose valid_from is after
# today (dates in Europe/Bucharest, YYYY-MM-DD). Facts without dates always apply.
# An expired fact is NOT replaced automatically: the owner must add the current year's rates
# below (with their own valid_from and valid_to) at the start of each fiscal year, or the
# generator has no verified rate to quote and will leave rates out.

tax_rates:
  - fact: "Impozitul pe castigurile din criptomonede este 10%"
    valid_from: "2024-01-01"
    valid_to: "2025-12-31"
    source: "Codul Fiscal, art. 94"

deadlines:
  - fact: "Declaratia Unica se depune pana pe 25 mai"
    recurrence: "annual"
    source: "ANAF"
  - fact: "Termenul pentru plata impozitului este 25 mai"
    recurrence: "annual"
    source: "ANAF"

thresholds:
  - fact: "Veniturile sub 600 lei pe tranzactie nu sunt scutite de impozit"
    note: "Common misconception: there is no minimum threshold"
    source: "Codul Fiscal"

product:
  - fact: "Taxes Support calculeaza automat impozitul pe tranzactiile crypto conform regulilor ANAF"
  - fact: "Suporta importul de tranzactii de pe Binance, Coinbase, Kraken si alte exchange-uri"
